<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Encompasso Unificado">
    <title>Encompasso Unificado</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">E</div>
        <div>
          <p class="eyebrow">Encompasso</p>
          <h1>Encompasso Unificado</h1>
        </div>
      </header>

      <p class="intro">Preencha seus dados nos campos abaixo.</p>

      <form id="encompasso-form" novalidate>
        <div id="form-summary" class="form-summary" role="alert" aria-live="assertive" tabindex="-1" hidden></div>

        <section class="form-card" aria-labelledby="identificacao-title">
          <div class="card-heading">
            <span class="card-number" aria-hidden="true">01</span>
            <div>
              <p class="card-kicker">Dados pessoais</p>
              <h2 id="identificacao-title">Identificação</h2>
            </div>
          </div>

          <div class="field-grid">
            <div class="field-group">
              <label for="nome_completo">Nome completo <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="nome_completo" name="nome_completo" type="text" autocomplete="name" maxlength="150" required>
              <p id="nome_completo-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="nome_social">Nome social <span class="optional">Opcional</span></label>
              <input id="nome_social" name="nome_social" type="text" autocomplete="nickname" maxlength="150">
              <p id="nome_social-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="data_nascimento">Data de nascimento <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="data_nascimento" name="data_nascimento" type="date" autocomplete="bday" required>
              <p id="data_nascimento-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="nacionalidade">Nacionalidade <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="nacionalidade" name="nacionalidade" type="text" autocomplete="off" maxlength="80" required>
              <p id="nacionalidade-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="tipo_documento">Tipo de documento <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <select id="tipo_documento" name="tipo_documento" autocomplete="off" required>
                <option value="">Selecione</option>
                <option value="cpf">CPF</option>
                <option value="passaporte">Passaporte</option>
              </select>
              <p id="tipo_documento-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="documento" id="documento-label">CPF <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="documento" name="documento" type="text" autocomplete="off" inputmode="numeric" maxlength="14" aria-describedby="documento-hint documento-error" required>
              <p id="documento-hint" class="field-hint">Informe 11 dígitos.</p>
              <p id="documento-error" class="field-error" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <section class="form-card" aria-labelledby="contato-title">
          <div class="card-heading">
            <span class="card-number" aria-hidden="true">02</span>
            <div>
              <p class="card-kicker">Como podemos falar com você</p>
              <h2 id="contato-title">Contato</h2>
            </div>
          </div>

          <div class="field-grid">
            <div class="field-group">
              <label for="telefone">Telefone <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required>
              <p id="telefone-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="email">E-mail <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
              <p id="email-error" class="field-error" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <section class="form-card" aria-labelledby="residencia-title">
          <div class="card-heading">
            <span class="card-number" aria-hidden="true">03</span>
            <div>
              <p class="card-kicker">Onde você mora</p>
              <h2 id="residencia-title">Residência</h2>
            </div>
          </div>

          <div class="field-grid">
            <div class="field-group">
              <label for="pais">País <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="pais" name="pais" type="text" autocomplete="country-name" maxlength="80" required>
              <p id="pais-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="estado_provincia">Estado/Província <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="estado_provincia" name="estado_provincia" type="text" autocomplete="address-level1" maxlength="100" required>
              <p id="estado_provincia-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="municipio_cidade">Município/Cidade <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="municipio_cidade" name="municipio_cidade" type="text" autocomplete="address-level2" maxlength="120" required>
              <p id="municipio_cidade-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group field-group-wide">
              <label for="logradouro_numero">Logradouro e número <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="logradouro_numero" name="logradouro_numero" type="text" autocomplete="street-address" maxlength="200" required>
              <p id="logradouro_numero-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="complemento">Complemento <span class="optional">Opcional</span></label>
              <input id="complemento" name="complemento" type="text" autocomplete="address-line2" maxlength="150">
              <p id="complemento-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="bairro_distrito">Bairro/Distrito <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="bairro_distrito" name="bairro_distrito" type="text" autocomplete="address-level3" maxlength="120" required>
              <p id="bairro_distrito-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="cep_codigo_postal">CEP/Código postal <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="cep_codigo_postal" name="cep_codigo_postal" type="text" autocomplete="postal-code" inputmode="text" maxlength="20" required>
              <p id="cep_codigo_postal-error" class="field-error" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <div class="form-actions">
          <button id="submit-button" type="submit">Enviar dados</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </div>

        <div class="honeypot" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
      </form>
    </main>
    <script src="/js/validation.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>

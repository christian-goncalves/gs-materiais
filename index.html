<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cadastro GS Materiais">
    <meta name="theme-color" content="#173f35">
    <title>GS Materiais</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <h1><img src="/Logo%20GS%20Materiais%20Dourado%20e%20Branco.png" alt="GS Materiais"></h1>
      </header>
      <p class="intro">Preencha seus dados nos campos abaixo.</p>

      <form id="materiais-form" novalidate>
        <div id="form-summary" class="form-summary" role="alert" aria-live="assertive" tabindex="-1" hidden></div>
        <section class="form-card" aria-labelledby="dados-pessoais-title">
          <div class="card-heading"><h2 id="dados-pessoais-title">Dados pessoais</h2></div>
          <div class="field-grid">
            <div class="field-group field-group-wide">
              <label for="nome_completo">Nome completo <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="nome_completo" name="nome_completo" type="text" autocomplete="name" maxlength="150" required aria-describedby="nome_completo-error">
              <p id="nome_completo-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="cpf">CPF <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="cpf" name="cpf" type="text" autocomplete="off" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required aria-describedby="cpf-error">
              <p id="cpf-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="telefone">Telefone <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required aria-describedby="telefone-error">
              <p id="telefone-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="cep">CEP <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="cep" name="cep" type="text" autocomplete="postal-code" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required aria-describedby="cep-hint cep-error">
              <p id="cep-hint" class="field-hint">Digite os oito números, sem hífen.</p>
              <p id="cep-error" class="field-error" aria-live="polite"></p>
              <p id="cep-status" class="field-hint" role="status" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="logradouro">Rua / Avenida <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="logradouro" name="logradouro" type="text" autocomplete="address-line1" required aria-describedby="logradouro-error">
              <p id="logradouro-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="numero">Número <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="numero" name="numero" type="text" autocomplete="off" required aria-describedby="numero-error">
              <p id="numero-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="complemento">Complemento <span class="optional">Opcional</span></label>
              <input id="complemento" name="complemento" type="text" autocomplete="address-line2" maxlength="50" aria-describedby="complemento-error">
              <p id="complemento-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="bairro">Bairro <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="bairro" name="bairro" type="text" autocomplete="address-level3" required aria-describedby="bairro-error">
              <p id="bairro-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="cidade">Cidade <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="cidade" name="cidade" type="text" autocomplete="address-level2" required aria-describedby="cidade-error">
              <p id="cidade-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="uf">UF <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatório</span></label>
              <input id="uf" name="uf" type="text" autocomplete="address-level1" maxlength="2" minlength="2" autocapitalize="characters" required aria-describedby="uf-error">
              <p id="uf-error" class="field-error" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <div class="consent-field">
          <input id="autorizacao-dados" name="autorizacao_dados_ficha_branca" type="checkbox" required aria-describedby="autorizacao-dados-error">
          <label for="autorizacao-dados">Autorizo o tratamento dos dados pessoais que informei para viabilizar o envio e o processamento da Ficha Branca. Esta autorização se limita a essa finalidade; outros usos dependerão de outra base legal prevista na LGPD e de informação prévia.</label>
          <p class="consent-hint">Para enviar este formulário, é necessário autorizar esse tratamento.</p>
          <p id="autorizacao-dados-error" class="consent-error" aria-live="polite"></p>
        </div>

        <div class="form-actions">
          <button id="submit-button" type="submit">Enviar cadastro</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </div>
        <div class="honeypot" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
      </form>
    </main>

    <dialog id="success-modal" aria-labelledby="success-title" aria-describedby="success-description">
      <div class="modal-content">
        <h2 id="success-title">Cadastro enviado com sucesso</h2>
        <p id="success-description">Seus dados foram recebidos.</p>
        <button id="close-modal" type="button">Fechar</button>
      </div>
    </dialog>

    <script src="/js/validation.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
